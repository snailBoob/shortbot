name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/snailboob/shortbot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Unit and HTTP integration tests
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and verify both architectures
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            tag="$IMAGE:sha-$GITHUB_SHA-$arch"
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "VERSION=$GITHUB_REF_NAME" \
              --build-arg "REVISION=$GITHUB_SHA" -t "$tag" .
            docker run --rm --platform "linux/$arch" --network none \
              --read-only --tmpfs /tmp \
              -v "$PWD/tests:/tests:ro" "$tag" \
              python -m unittest discover -s /tests -v
            # Exercise non-root access to a fresh production-style state volume.
            volume="shortbot-check-$GITHUB_RUN_ID-$arch"
            docker volume create "$volume"
            docker run --rm --platform "linux/$arch" --network none \
              --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              -v "$volume:/data" "$tag" python -c \
              'import os, shortbot; assert os.getuid() != 0; db=shortbot.open_state(os.environ["STATE_PATH"]); assert shortbot.reserve(db,"BTCUSDT",100000); db.close(); assert shortbot.configuration()[1].key == "UTC"'
            docker volume rm "$volume"
          done
          NTFY_TOPIC=shortbot-ci docker compose config --quiet
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images and multi-platform manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for arch in amd64 arm64; do
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" | tee manifest.txt
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --raw > manifest.json
          python3 -c 'import json; m=json.load(open("manifest.json")); assert {(x["platform"]["os"],x["platform"]["architecture"]) for x in m["manifests"]} == {("linux","amd64"),("linux","arm64")}'
          cat manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public package visibility
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "/users/$OWNER/packages/container/shortbot" --jq .visibility > visibility.txt
          grep -qx public visibility.txt
      - name: Promote verified release to latest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$digest"
          # Use an empty Docker config to prove public access without credentials.
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          for arch in amd64 arm64; do
            DOCKER_CONFIG="$anonymous_config" docker pull --platform "linux/$arch" "$IMAGE:latest"
          done
